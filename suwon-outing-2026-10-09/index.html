* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--page); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.6; word-break: keep-all; }
.hidden { display: none !important; }

.page { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }

.remember { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 14px; }
.remember input { width: 18px; height: 18px; accent-color: var(--accent); }
.error { margin: 0; color: var(--negative); font-size: 14px; }
.submit { font: inherit; font-weight: 600; font-size: 16px; padding: 12px; border: 0; border-radius: 3px; background: var(--accent); color: var(--on-accent); cursor: pointer; }

                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;
                }
            });

            // handle password form submission
            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

                if (!isSuccessful) {
                    const err = document.getElementById("staticrypt-error");
                    err.textContent = templateError;
                    err.hidden = false;
                    const input = document.getElementById("staticrypt-password");
                    input.select();
                    input.focus();
                }
            });
        </script>
</body>
</html>
